<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>VoltEdge Electronics</title>
<style>
:root{--p:#101828;--s:#2563eb;--a:#7c3aed;--bg:#f8fafc;--card:#fff;--t:#1e293b;--m:#64748b;--ok:#16a34a;--bd:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#111a2e;--t:#e2e8f0;--m:#94a3b8;--bd:#1e293b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#111a2e;--t:#e2e8f0;--m:#94a3b8;--bd:#1e293b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--s)}
.w{max-width:1200px;margin:auto;padding:0 16px}.sec{padding:28px 0}h2{margin:0 0 14px;font-size:24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:1px solid var(--bd);backdrop-filter:blur(8px)}
.nav{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}.logo{font-weight:800;font-size:20px;cursor:pointer;background:linear-gradient(90deg,var(--s),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.links{display:flex;gap:4px;flex-wrap:wrap}.links a{padding:6px 10px;border-radius:10px;color:var(--t);text-decoration:none;cursor:pointer}.links a:hover,.links a.on{background:var(--bd)}
.sb{position:relative;flex:1;min-width:180px}.sb input{width:100%}.sug{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:4px;box-shadow:0 8px 24px #0002;overflow:hidden}.sug div{padding:8px 12px;cursor:pointer}.sug div:hover{background:var(--bd)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;min-height:40px}input:focus,select:focus,textarea:focus{outline:2px solid var(--s)}
.btn{background:var(--s);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;min-height:40px;transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}.btn.g{background:var(--bd);color:var(--t)}.btn.v{background:var(--a)}.btn.r{background:#dc2626}.btn:disabled{opacity:.5;cursor:not-allowed}
.ic{position:relative;background:none;border:0;font-size:20px;cursor:pointer;padding:6px}.ic i{position:absolute;top:-2px;right:-2px;background:var(--a);color:#fff;font-size:11px;border-radius:9px;padding:0 5px;font-style:normal}
.hero{background:linear-gradient(135deg,var(--p),#1e3a8a 55%,var(--a));color:#fff;border-radius:24px;padding:48px 28px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;margin-top:20px}.hero h1{font-size:clamp(28px,5vw,48px);margin:0 0 10px;line-height:1.1}.hero .big{font-size:110px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.cats{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 2px 10px #0000000d;transition:.25s;overflow:hidden}.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px #00000020}
.img{position:relative;height:150px;display:grid;place-items:center;font-size:64px;cursor:pointer}.bdg{position:absolute;top:10px;left:10px;background:var(--ok);color:#fff;font-size:12px;border-radius:8px;padding:2px 8px}.hb{position:absolute;top:8px;right:8px;border:0;background:#fffc;border-radius:50%;width:34px;height:34px;cursor:pointer;color:#e11d48;font-size:18px}
.pb{padding:12px}.pb h4{margin:2px 0;font-size:15px}.m{color:var(--m);font-size:13px}.pr{font-weight:800;font-size:17px}.old{text-decoration:line-through;color:var(--m);font-size:13px;margin-left:6px;font-weight:400}.st{color:#f59e0b}
.cc{padding:18px 10px;text-align:center;cursor:pointer}.cc span{font-size:36px;display:block}
.sale{background:linear-gradient(90deg,#be123c,var(--a));color:#fff;border-radius:20px;padding:20px}.sale h2{color:#fff}.cd{display:flex;gap:8px;margin-bottom:12px}.cd span{background:#fff3;border-radius:10px;padding:6px 10px;text-align:center}.cd b{font-size:22px;margin-right:2px}
.two{display:grid;grid-template-columns:240px 1fr;gap:18px}.fl{padding:14px;display:grid;gap:10px;align-self:start}
.row{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--bd);flex-wrap:wrap}.row>.grow{flex:1;min-width:140px}
.tbl{width:100%;border-collapse:collapse}.tbl td,.tbl th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}.tw{overflow-x:auto}
.fm{display:grid;gap:10px}.fm label{display:grid;gap:3px;font-size:13px;color:var(--m)}.er{color:#dc2626;font-size:12px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;background:var(--bd)}.pill.ok{background:#16a34a22;color:var(--ok)}.pill.w{background:#f59e0b22;color:#d97706}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stats .card{padding:14px}.stats b{font-size:22px;display:block}
.bars{display:flex;gap:14px;align-items:flex-end;height:120px;padding:10px}.bars div{flex:1;background:linear-gradient(var(--a),var(--s));border-radius:8px 8px 0 0;text-align:center;color:#fff;font-size:12px;min-height:6px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 18px;border-radius:12px;z-index:90;animation:up .3s}@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
.inv{position:fixed;inset:0;background:#000a;z-index:80;display:grid;place-items:center;padding:16px}.inv .card{padding:24px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.spin{width:40px;height:40px;border:4px solid var(--bd);border-top-color:var(--s);border-radius:50%;animation:sp 1s linear infinite;margin:80px auto}@keyframes sp{to{transform:rotate(360deg)}}
footer{background:var(--p);color:#cbd5e1;margin-top:40px;padding:30px 0}footer a{color:#cbd5e1;cursor:pointer}
@media(max-width:760px){.hero,.two{grid-template-columns:1fr}.hero .big{font-size:70px}.links{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}.grid{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(2,1fr)}.img{height:120px;font-size:48px}}
@media print{header,footer,.noprint,.toast,.w>*:not(.inv){display:none!important}.inv{position:static;background:none}}
</style></head><body><div id="root"><div class="spin"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect,useMemo,useContext,createContext}=React;const h=htm.bind(React.createElement);const C=createContext();
const money=n=>"TSh "+Math.round(n).toLocaleString("en-US");const go=p=>{location.hash=p};
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
function usePersist(k,i){const[v,s]=useState(()=>{try{const x=localStorage.getItem(k);return x?JSON.parse(x):i}catch(e){return i}});useEffect(()=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},[k,v]);return[v,s]}
const CATS=[["smartphones","📱","Smartphones"],["laptops","💻","Laptops"],["desktops","🖥️","Desktop Computers"],["tablets","📲","Tablets"],["tvs","📺","Smart TVs"],["watches","⌚","Smart Watches"],["audio","🎧","Headphones & Earbuds"],["cameras","📷","Cameras"],["gaming","🎮","Gaming Consoles"],["accessories","🖱️","Computer Accessories"],["speakers","🔊","Speakers"],["printers","🖨️","Printers"],["network","📡","Networking Devices"],["appliances","🧊","Home Appliances"]];
const EMO=CATS.map(c=>c[1]);
const SEED=[["iPhone 15 Pro 256GB","Apple","smartphones",3200000,3600000,4.8,12,"New","📱",950,"6.1-inch OLED · A17 Pro · 256GB · 48MP camera"],["Galaxy S24 Ultra","Samsung","smartphones",3400000,3800000,4.7,8,"New","📱",800,"6.8-inch AMOLED · 12GB RAM · 200MP · S Pen"],["MacBook Air M2","Apple","laptops",2900000,3300000,4.9,6,"New","💻",700,"13.6-inch Retina · M2 · 8GB · 256GB SSD"],["ThinkPad X1 Carbon","Lenovo","laptops",3500000,3900000,4.6,4,"New","💻",350,"14-inch 2.8K · Core i7 · 16GB · 512GB"],["Dell XPS Desktop","Dell","desktops",2600000,2900000,4.5,5,"New","🖥️",300,"Core i7 · 16GB · 1TB SSD · RTX 4060"],["iPad Air 11-inch","Apple","tablets",1800000,2000000,4.7,10,"New","📲",450,"M2 chip · 128GB · Liquid Retina"],["Samsung 55-inch 4K Smart TV","Samsung","tvs",1500000,1900000,4.6,9,"New","📺",520,"4K UHD · HDR10+ · Tizen · 3 HDMI"],["Apple Watch Series 9","Apple","watches",1100000,1250000,4.7,14,"New","⌚",610,"45mm · GPS · Always-on · ECG"],["Sony WH-1000XM5","Sony","audio",780000,950000,4.8,20,"New","🎧",880,"ANC · 30h battery · Bluetooth 5.2"],["AirPods Pro 2","Apple","audio",620000,700000,4.8,25,"New","🎧",990,"ANC · USB-C · 6h battery"],["Canon EOS R50","Canon","cameras",2100000,2400000,4.6,4,"New","📷",210,"24.2MP · 4K video · RF mount"],["PlayStation 5","Sony","gaming",1650000,1800000,4.9,3,"New","🎮",760,"825GB SSD · 4K 120fps · DualSense"],["Logitech MX Master 3S","Logitech","accessories",260000,310000,4.8,30,"New","🖱️",430,"8K DPI · Quiet clicks · USB-C"],["JBL Charge 5","JBL","speakers",350000,420000,4.6,18,"New","🔊",390,"IP67 · 20h playtime · Powerbank"],["HP LaserJet Pro","HP","printers",720000,800000,4.3,7,"New","🖨️",150,"Mono laser · Wi-Fi · Duplex"],["TP-Link Archer AX55","TP-Link","network",230000,280000,4.5,22,"New","📡",330,"Wi-Fi 6 · AX3000 · Gigabit"],["LG Inverter Fridge","LG","appliances",1900000,2200000,4.4,5,"New","🧊",240,"420L · Inverter · Frost-free"],["iPhone 12 128GB","Apple","smartphones",1100000,1100000,4.2,1,"Used","📱",120,"6.1-inch OLED · A14 · 128GB · Battery 86%"],["Dell Latitude 7490","Dell","laptops",950000,1200000,4.3,2,"Refurbished","💻",90,"14-inch FHD · Core i5 · 8GB · 256GB SSD"]].map((r,i)=>({id:i+1,name:r[0],brand:r[1],cat:r[2],price:r[3],old:r[4],rating:r[5],stock:r[6],cond:r[7],e:r[8],sales:r[9],spec:r[10],owner:"VoltEdge",status:"approved",at:i}));
const WAR={New:"2-year manufacturer warranty",Refurbished:"6-month seller warranty",Used:"7-day return window"};
const g=id=>`linear-gradient(135deg,hsl(${id*47%360} 80% 90%),hsl(${id*47%360} 75% 78%))`;
const stars=r=>"★".repeat(Math.round(r))+"☆".repeat(5-Math.round(r));
const disc=p=>Math.round(100-p.price/p.old*100);

function Card({p}){const S=useContext(C),w=S.wish.includes(p.id),d=disc(p);
return h`<div className="card"><div className="img" onClick=${()=>go("product-"+p.id)} style=${{background:g(p.id)}}>${p.e}${d>0&&h`<b className="bdg">-${d}%</b>`}<button className="hb" aria-label="Wishlist" onClick=${e=>{e.stopPropagation();S.tw(p.id)}}>${w?"♥":"♡"}</button></div><div className="pb"><div className="m">${p.brand} · ${p.cond}</div><h4>${p.name}</h4><div className="st">${stars(p.rating)} <span className="m">${p.rating}</span></div><div><span className="pr">${money(p.price)}</span>${d>0&&h`<span className="old">${money(p.old)}</span>`}</div><button className="btn" style=${{width:"100%",marginTop:8}} disabled=${p.stock<1} onClick=${()=>S.add(p.id)}>${p.stock<1?"Out of stock":"Add to cart"}</button></div></div>`}

function CatGrid(){const S=useContext(C);return h`<div className="grid cats">${CATS.map(c=>h`<div key=${c[0]} className="card cc" onClick=${()=>{S.setF({cat:c[0]});go("shop")}}><span>${c[1]}</span><b>${c[2]}</b><div className="m">${S.live.filter(p=>p.cat===c[0]).length} products</div></div>`)}</div>`}

function Count(){const[t,setT]=useState(0);useEffect(()=>{const f=()=>{const n=new Date(),e=new Date(n);e.setHours(24,0,0,0);setT(e-n)};f();const i=setInterval(f,1000);return()=>clearInterval(i)},[]);const p=x=>String(Math.floor(x)).padStart(2,"0");return h`<div className="cd">${[[t/36e5,"h"],[t/6e4%60,"m"],[t/1e3%60,"s"]].map(([v,l])=>h`<span key=${l}><b>${p(v)}</b>${l}</span>`)}</div>`}

function Home(){const S=useContext(C),L=S.live,[em,setEm]=useState("");
const sub=e=>{e.preventDefault();/^\S+@\S+\.\S+$/.test(em)?(S.toast("Thanks for subscribing!"),setEm("")):S.toast("Enter a valid email")};
return h`<div className="w"><div className="hero"><div><span className="pill">New season · Up to 25% off</span><h1>Premium electronics, delivered to your door.</h1><p>Phones, laptops, gaming and more from trusted brands, with warranty on every order.</p><button className="btn v" onClick=${()=>go("shop")}>Shop now</button> <button className="btn g" onClick=${()=>go("sell")}>Sell your device</button></div><div className="big">📱💻🎧</div></div>
<div className="sec"><h2>Popular categories</h2><${CatGrid}/></div>
<div className="sale"><h2>⚡ Flash sale · ends in</h2><${Count}/><div className="grid">${L.filter(p=>disc(p)>=12).slice(0,4).map(p=>h`<${Card} key=${p.id} p=${p}/>`)}</div></div>
<div className="sec"><h2>Best sellers</h2><div className="grid">${[...L].sort((a,b)=>b.sales-a.sales).slice(0,4).map(p=>h`<${Card} key=${p.id} p=${p}/>`)}</div></div>
<div className="sec"><h2>New arrivals</h2><div className="grid">${[...L].sort((a,b)=>b.at-a.at).slice(0,4).map(p=>h`<${Card} key=${p.id} p=${p}/>`)}</div></div>
<div className="sec"><h2>Featured brands</h2><div className="grid cats">${["Apple","Samsung","Sony","Dell","Lenovo","LG"].map(b=>h`<div key=${b} className="card cc" onClick=${()=>{S.setF({brand:b});go("shop")}}><b>${b}</b></div>`)}</div></div>
<div className="sec"><h2>What customers say</h2><div className="grid">${[["Amina K.","Fast delivery and the phone was genuine. Great service!"],["Joseph M.","Found a refurbished laptop at a fair price with warranty."],["Neema T.","Easy checkout and helpful support team."]].map(t=>h`<div key=${t[0]} className="card pb"><div className="st">★★★★★</div><p>“${t[1]}”</p><b>${t[0]}</b></div>`)}</div></div>
<form className="card pb sec" onSubmit=${sub} style=${{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}><b style=${{flex:"1 1 200px"}}>Get deals in your inbox</b><input type="email" placeholder="you@email.com" value=${em} onChange=${e=>setEm(e.target.value)} style=${{flex:"2 1 220px"}}/><button className="btn">Subscribe</button></form></div>`}

function Shop(){const S=useContext(C),f=S.f,[pg,setPg]=useState(1),[load,setLoad]=useState(true);
useEffect(()=>{setPg(1)},[f]);useEffect(()=>{const t=setTimeout(()=>setLoad(false),350);return()=>clearTimeout(t)},[]);
const brands=[...new Set(S.live.map(p=>p.brand))].sort();
let list=S.live.filter(p=>(!f.q||(p.name+p.brand+p.spec).toLowerCase().includes(f.q.toLowerCase()))&&(!f.cat||p.cat===f.cat)&&(!f.brand||p.brand===f.brand)&&(!f.cond||p.cond===f.cond)&&p.price<=(f.max||6e6));
const so=f.sort||"pop";list=[...list].sort((a,b)=>so==="lo"?a.price-b.price:so==="hi"?b.price-a.price:so==="new"?b.at-a.at:b.sales-a.sales);
const pages=Math.max(1,Math.ceil(list.length/9));
return h`<div className="w sec"><h2>Shop</h2><div className="two"><div className="card fl"><input placeholder="Search products" value=${f.q||""} onChange=${e=>S.setF({q:e.target.value})}/>
<select value=${f.cat||""} onChange=${e=>S.setF({cat:e.target.value})}><option value="">All categories</option>${CATS.map(c=>h`<option key=${c[0]} value=${c[0]}>${c[2]}</option>`)}</select>
<select value=${f.brand||""} onChange=${e=>S.setF({brand:e.target.value})}><option value="">All brands</option>${brands.map(b=>h`<option key=${b}>${b}</option>`)}</select>
<select value=${f.cond||""} onChange=${e=>S.setF({cond:e.target.value})}><option value="">Any condition</option><option>New</option><option>Used</option><option>Refurbished</option></select>
<label className="m">Max price: ${money(f.max||6e6)}<input type="range" min="100000" max="6000000" step="100000" value=${f.max||6e6} onChange=${e=>S.setF({max:+e.target.value})} style=${{width:"100%"}}/></label>
<select value=${so} onChange=${e=>S.setF({sort:e.target.value})}><option value="pop">Popularity</option><option value="new">Newest</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select>
<button className="btn g" onClick=${()=>S.setF({q:"",cat:"",brand:"",cond:"",max:6e6,sort:"pop"})}>Reset filters</button></div>
<div>${load?h`<div className="spin"/>`:list.length?h`<div className="grid">${list.slice((pg-1)*9,pg*9).map(p=>h`<${Card} key=${p.id} p=${p}/>`)}</div><div style=${{display:"flex",gap:8,justifyContent:"center",marginTop:16}}><button className="btn g" disabled=${pg<2} onClick=${()=>setPg(pg-1)}>Prev</button><span className="m" style=${{alignSelf:"center"}}>Page ${pg} of ${pages}</span><button className="btn g" disabled=${pg>=pages} onClick=${()=>setPg(pg+1)}>Next</button></div>`:h`<p className="m">No products match your filters.</p>`}</div></div></div>`}

function Detail({id}){const S=useContext(C),p=S.prods.find(x=>x.id===id),[q,setQ]=useState(1),[v,setV]=useState(0),[rv,setRv]=useState({r:5,t:""});
if(!p)return h`<div className="w sec"><p>Product not found.</p></div>`;
const revs=S.rev[id]||[],d=disc(p);
const post=e=>{e.preventDefault();if(!S.user)return go("login");if(rv.t.length<5)return S.toast("Write a short review");S.setRev({...S.rev,[id]:[...revs,{n:S.user.name,r:+rv.r,t:rv.t}]});setRv({r:5,t:""})};
return h`<div className="w sec"><div className="two" style=${{gridTemplateColumns:"minmax(0,1fr) minmax(0,1.2fr)"}}><div><div className="card img" style=${{height:320,fontSize:130,background:g(p.id),filter:`hue-rotate(${v*50}deg)`,cursor:"default"}}>${p.e}</div><div style=${{display:"flex",gap:8,marginTop:8}}>${[0,1,2].map(i=>h`<div key=${i} className="card img" onClick=${()=>setV(i)} style=${{height:64,width:64,fontSize:28,background:g(p.id),filter:`hue-rotate(${i*50}deg)`,outline:v===i?"2px solid var(--s)":"none"}}>${p.e}</div>`)}</div></div>
<div><span className="pill">${p.cond}</span> <span className="pill">${CATS.find(c=>c[0]===p.cat)[2]}</span><h2 style=${{margin:"8px 0"}}>${p.name}</h2><div className="st">${stars(p.rating)} <span className="m">${p.rating} · ${revs.length} reviews</span></div>
<p><span className="pr" style=${{fontSize:28}}>${money(p.price)}</span>${d>0&&h`<span className="old">${money(p.old)}</span> <span className="pill ok">Save ${d}%</span>`}</p>
<p className="m">${p.brand} · Sold by ${p.owner==="VoltEdge"?"VoltEdge":p.owner}</p><p>${p.stock>0?h`<span className="pill ok">${p.stock>5?"In stock":"Only "+p.stock+" left"}</span>`:h`<span className="pill w">Out of stock</span>`} · 🛡️ ${WAR[p.cond]}</p>
<div style=${{display:"flex",gap:8,flexWrap:"wrap"}}><span style=${{display:"flex",alignItems:"center",gap:6}}><button className="btn g" onClick=${()=>setQ(Math.max(1,q-1))}>−</button><b>${q}</b><button className="btn g" onClick=${()=>setQ(Math.min(p.stock,q+1))}>+</button></span><button className="btn" disabled=${p.stock<1} onClick=${()=>S.add(p.id,q)}>Add to cart</button><button className="btn v" disabled=${p.stock<1} onClick=${()=>{S.add(p.id,q);go("checkout")}}>Buy now</button><button className="btn g" onClick=${()=>S.tw(p.id)}>${S.wish.includes(p.id)?"♥ Saved":"♡ Wishlist"}</button></div>
<h4>Specifications</h4><table className="tbl"><tbody>${p.spec.split(" · ").map((s,i)=>h`<tr key=${i}><td>${s}</td></tr>`)}<tr><td>Warranty: ${WAR[p.cond]}</td></tr></tbody></table></div></div>
<div className="sec"><h2>Customer reviews</h2>${revs.map((r,i)=>h`<div key=${i} className="row"><b>${r.n}</b><span className="st">${stars(r.r)}</span><span className="grow">${r.t}</span></div>`)}${!revs.length&&h`<p className="m">No reviews yet.</p>`}
<form className="fm" onSubmit=${post}><select value=${rv.r} onChange=${e=>setRv({...rv,r:e.target.value})}>${[5,4,3,2,1].map(n=>h`<option key=${n} value=${n}>${n} stars</option>`)}</select><textarea placeholder="Share your experience" value=${rv.t} onChange=${e=>setRv({...rv,t:e.target.value})}/><button className="btn" style=${{justifySelf:"start"}}>Submit review</button></form></div>
<h2>Related products</h2><div className="grid">${S.live.filter(x=>x.cat===p.cat&&x.id!==id).concat(S.live.filter(x=>x.cat!==p.cat)).slice(0,4).map(x=>h`<${Card} key=${x.id} p=${x}/>`)}</div></div>`}

function Cart(){const S=useContext(C),T=S.totals(0);
if(!S.lines.length)return h`<div className="w sec"><h2>Your cart is empty</h2><button className="btn" onClick=${()=>go("shop")}>Continue shopping</button></div>`;
return h`<div className="w sec"><h2>Shopping cart</h2><div className="two" style=${{gridTemplateColumns:"1fr 300px"}}><div className="card">${S.lines.map(({p,q})=>h`<div key=${p.id} className="row"><span style=${{fontSize:36}}>${p.e}</span><div className="grow"><b>${p.name}</b><div className="m">${money(p.price)}</div></div><button className="btn g" onClick=${()=>S.setQty(p.id,q-1)}>−</button><b>${q}</b><button className="btn g" onClick=${()=>S.setQty(p.id,q+1)}>+</button><b>${money(p.price*q)}</b><button className="btn r" onClick=${()=>S.setQty(p.id,0)}>Remove</button></div>`)}</div>
<div className="card pb"><${Sum} T=${T}/><button className="btn" style=${{width:"100%"}} onClick=${()=>go("checkout")}>Proceed to checkout</button></div></div></div>`}
function Sum({T}){return h`<div><div className="row"><span className="grow">Subtotal</span>${money(T.sub)}</div><div className="row"><span className="grow">Discounts</span><span style=${{color:"var(--ok)"}}>−${money(T.save)}</span></div><div className="row"><span className="grow">Delivery</span>${T.del?money(T.del):"Free"}</div><div className="row"><b className="grow">Total</b><b>${money(T.total)}</b></div></div>`}

function Checkout(){const S=useContext(C),u=S.user||{};
const[f,setF]=useState({name:u.name||"",email:u.email||"",phone:u.phone||"",addr:u.addr||"",region:"Dar es Salaam",city:"",dm:"std",pay:"mpesa"}),[er,setEr]=useState({}),[done,setDone]=useState(null);
if(done)return h`<div className="w sec card pb"><h2>✅ Order placed</h2><p>Order number <b>${done.no}</b>. Status: <span className="pill w">${done.status}</span></p><p className="m">${done.status==="Awaiting payment"?"Your payment must be confirmed by the payment provider before we process this order.":"Pay in cash when your order arrives."}</p><button className="btn" onClick=${()=>S.setInv(done)}>View invoice</button> <button className="btn g" onClick=${()=>go("shop")}>Keep shopping</button></div>`;
if(!S.lines.length)return h`<div className="w sec"><h2>Nothing to check out</h2><button className="btn" onClick=${()=>go("shop")}>Shop</button></div>`;
const T=S.totals(f.dm==="exp"?30000:f.dm==="pick"?-1:0),set=k=>e=>setF({...f,[k]:e.target.value});
const sub=e=>{e.preventDefault();const x={};if(f.name.trim().length<3)x.name="Enter your full name";if(!/^\S+@\S+\.\S+$/.test(f.email))x.email="Enter a valid email";if(!/^\+?\d{9,13}$/.test(f.phone))x.phone="Enter a valid phone number";if(f.addr.trim().length<5)x.addr="Enter your delivery address";if(f.city.trim().length<2)x.city="Enter your city";setEr(x);if(Object.keys(x).length)return;
const o={no:"VE-"+Date.now().toString(36).toUpperCase(),date:new Date().toLocaleString(),user:u.email||f.email,name:f.name,addr:f.addr+", "+f.city+", "+f.region,pay:f.pay,items:S.lines.map(({p,q})=>({id:p.id,name:p.name,price:p.price,q,owner:p.owner})),total:T.total,del:T.del,status:f.pay==="cod"?"Processing":"Awaiting payment"};
S.placeOrder(o);setDone(o)};
const F=(k,l,t)=>h`<label>${l}<input type=${t||"text"} value=${f[k]} onChange=${set(k)}/>${er[k]&&h`<span className="er">${er[k]}</span>`}</label>`;
const P=[["mpesa","M-Pesa"],["airtel","Airtel Money"],["tigo","Tigo Pesa"],["bank","Bank transfer"],["cod","Cash on delivery"],["card","Card (secure provider)"]];
return h`<div className="w sec"><h2>Checkout</h2><form className="two" style=${{gridTemplateColumns:"1fr 320px"}} onSubmit=${sub}><div className="card pb fm">${F("name","Full name")}${F("email","Email address","email")}${F("phone","Phone number","tel")}${F("addr","Delivery address")}<div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><label>Region<select value=${f.region} onChange=${set("region")}>${["Dar es Salaam","Arusha","Dodoma","Mwanza","Mbeya","Zanzibar"].map(r=>h`<option key=${r}>${r}</option>`)}</select></label>${F("city","City")}</div>
<label>Delivery method<select value=${f.dm} onChange=${set("dm")}><option value="std">Standard (2–4 days)</option><option value="exp">Express (next day, +TSh 30,000)</option><option value="pick">Store pickup (free)</option></select></label>
<b>Payment method</b>${P.map(x=>h`<label key=${x[0]} style=${{display:"flex",gap:8,alignItems:"center",color:"var(--t)"}}><input type="radio" name="pay" checked=${f.pay===x[0]} onChange=${()=>setF({...f,pay:x[0]})} style=${{minHeight:0}}/>${x[1]}</label>`)}
<p className="m">Mobile money, bank and card payments are confirmed by the payment provider through your server. This front-end build records the order as “Awaiting payment” and never marks anything as paid.</p></div>
<div className="card pb" style=${{alignSelf:"start"}}><b>Order summary</b>${S.lines.map(({p,q})=>h`<div key=${p.id} className="m">${q} × ${p.name}</div>`)}<${Sum} T=${T}/><button className="btn" style=${{width:"100%"}}>Place order</button></div></form></div>`}

function Wishlist(){const S=useContext(C),L=S.live.filter(p=>S.wish.includes(p.id));return h`<div className="w sec"><h2>Wishlist</h2>${L.length?h`<div className="grid">${L.map(p=>h`<${Card} key=${p.id} p=${p}/>`)}</div>`:h`<p className="m">Tap the heart on any product to save it here.</p>`}</div>`}

function Auth(){const S=useContext(C),[reg,setReg]=useState(false),[f,setF]=useState({name:"",email:"",pw:"",role:"buyer",shop:""}),[er,setEr]=useState("");
const set=k=>e=>setF({...f,[k]:e.target.value});
const sub=async e=>{e.preventDefault();setEr("");if(!/^\S+@\S+\.\S+$/.test(f.email))return setEr("Enter a valid email");if(f.pw.length<6)return setEr("Password needs at least 6 characters");const hs=await hash(f.pw),em=f.email.toLowerCase();
if(reg){if(f.name.length<2)return setEr("Enter your name");if(S.users.some(u=>u.email===em))return setEr("Email already registered");if(f.role==="seller"&&f.shop.length<2)return setEr("Enter your shop name");const u={name:f.name,email:em,hs,role:f.role,shop:f.shop,approved:f.role!=="seller",phone:"",addr:""};S.setUsers([...S.users,u]);S.setSess(em);go(f.role==="seller"?"dashboard":"home")}
else{const u=S.users.find(x=>x.email===em&&x.hs===hs);if(!u)return setEr("Wrong email or password");S.setSess(em);go(u.role==="buyer"?"home":"dashboard")}};
return h`<div className="w sec" style=${{maxWidth:420}}><form className="card pb fm" onSubmit=${sub}><h2>${reg?"Create account":"Welcome back"}</h2>${reg&&h`<label>Full name<input value=${f.name} onChange=${set("name")}/></label>`}<label>Email<input type="email" value=${f.email} onChange=${set("email")}/></label><label>Password<input type="password" value=${f.pw} onChange=${set("pw")}/></label>
${reg&&h`<label>Account type<select value=${f.role} onChange=${set("role")}><option value="buyer">Buyer</option><option value="seller">Seller (needs admin approval)</option></select></label>`}${reg&&f.role==="seller"&&h`<label>Shop name<input value=${f.shop} onChange=${set("shop")}/></label>`}
${er&&h`<span className="er">${er}</span>`}<button className="btn">${reg?"Register":"Login"}</button><a onClick=${()=>setReg(!reg)} style=${{cursor:"pointer"}}>${reg?"Have an account? Login":"New here? Register"}</a><p className="m">Demo admin: admin@volt.test / admin123. Accounts live in this browser only; real password reset needs a backend.</p></form></div>`}

function Account(){const S=useContext(C),u=S.user;if(!u)return h`<div className="w sec"><button className="btn" onClick=${()=>go("login")}>Login to continue</button></div>`;
const[f,setF]=useState({name:u.name,phone:u.phone||"",addr:u.addr||""});const mine=S.orders.filter(o=>o.user===u.email);
return h`<div className="w sec"><h2>My account</h2><div className="two" style=${{gridTemplateColumns:"1fr 1.5fr"}}><form className="card pb fm" onSubmit=${e=>{e.preventDefault();S.setUsers(S.users.map(x=>x.email===u.email?{...x,...f}:x));S.toast("Profile saved")}}><b>${u.email} · ${u.role}</b><label>Name<input value=${f.name} onChange=${e=>setF({...f,name:e.target.value})}/></label><label>Phone<input value=${f.phone} onChange=${e=>setF({...f,phone:e.target.value})}/></label><label>Saved address<input value=${f.addr} onChange=${e=>setF({...f,addr:e.target.value})}/></label><button className="btn">Save</button><button type="button" className="btn g" onClick=${()=>{S.setSess(null);go("home")}}>Logout</button></form>
<div className="card"><div className="pb"><b>Order history</b></div>${mine.map(o=>h`<div key=${o.no} className="row"><div className="grow"><b>${o.no}</b><div className="m">${o.date}</div></div><span className="pill">${o.status}</span><b>${money(o.total)}</b><button className="btn g" onClick=${()=>S.setInv(o)}>Invoice</button></div>`)}${!mine.length&&h`<p className="pb m">No orders yet.</p>`}</div></div></div>`}

function PF({used}){const S=useContext(C),[f,setF]=useState({name:"",brand:"",cat:"smartphones",price:"",old:"",stock:1,cond:used?"Used":"New",e:"📱",spec:""}),set=k=>e=>setF({...f,[k]:e.target.value});
if(!S.user)return h`<button className="btn" onClick=${()=>go("login")}>Login to post a listing</button>`;
const sub=e=>{e.preventDefault();const pr=+f.price;if(f.name.trim().length<3||!(pr>0))return S.toast("Enter a name and valid price");const adm=S.user.role==="admin";S.setProds(p=>[...p,{id:Math.max(0,...p.map(x=>x.id))+1,name:f.name,brand:f.brand||"Generic",cat:f.cat,price:pr,old:Math.max(+f.old||pr,pr),rating:4,stock:+f.stock||1,cond:f.cond,e:f.e,sales:0,spec:f.spec||"No details",owner:S.user.email,status:adm?"approved":"pending",at:Date.now()}]);S.toast(adm?"Product published":"Submitted for admin approval");setF({...f,name:"",price:"",old:"",spec:""})};
return h`<form className="card pb fm" onSubmit=${sub}><b>${used?"Post a used device":"Add product"}</b><input placeholder="Title" value=${f.name} onChange=${set("name")}/><input placeholder="Brand" value=${f.brand} onChange=${set("brand")}/><select value=${f.cat} onChange=${set("cat")}>${CATS.map(c=>h`<option key=${c[0]} value=${c[0]}>${c[2]}</option>`)}</select><select value=${f.e} onChange=${set("e")}>${EMO.map(x=>h`<option key=${x}>${x}</option>`)}</select><input type="number" placeholder="Price (TSh)" value=${f.price} onChange=${set("price")}/>${!used&&h`<input type="number" placeholder="Original price (optional)" value=${f.old} onChange=${set("old")}/>`}<input type="number" min="1" placeholder="Stock" value=${f.stock} onChange=${set("stock")}/><select value=${f.cond} onChange=${set("cond")}>${(used?["Used","Refurbished"]:["New","Used","Refurbished"]).map(x=>h`<option key=${x}>${x}</option>`)}</select><textarea placeholder="Description / specs separated by ·" value=${f.spec} onChange=${set("spec")}/><button className="btn">Submit</button></form>`}

function Sell(){return h`<div className="w sec" style=${{maxWidth:520}}><h2>Sell used electronics</h2><p className="m">Listings are reviewed by an admin before they appear in the shop.</p><${PF} used=${true}/></div>`}

function Dash(){const S=useContext(C),u=S.user;if(!u||u.role==="buyer")return h`<div className="w sec"><p>Seller or admin access only.</p><button className="btn" onClick=${()=>go("login")}>Login</button></div>`;
const adm=u.role==="admin",mine=S.prods.filter(p=>adm||p.owner===u.email),ord=adm?S.orders:S.orders.filter(o=>o.items.some(i=>i.owner===u.email)),part=o=>adm?o.total:o.items.filter(i=>i.owner===u.email).reduce((s,i)=>s+i.price*i.q,0);
const rev=ord.filter(o=>["Processing","Shipped","Delivered"].includes(o.status)).reduce((a,o)=>a+part(o),0),ST=["Awaiting payment","Processing","Shipped","Delivered","Cancelled"];
const stat=[["Revenue",money(rev)],["Orders",ord.length],["Pending",ord.filter(o=>["Awaiting payment","Processing"].includes(o.status)).length],["Products",mine.length],["Low stock",mine.filter(p=>p.stock<5).length]].concat(adm?[["Customers",S.users.filter(x=>x.role==="buyer").length]]:[]);
const mx=Math.max(1,...ST.map(s=>ord.filter(o=>o.status===s).length));
return h`<div className="w sec"><h2>${adm?"Admin":"Seller"} dashboard</h2><div className="stats">${stat.map(s=>h`<div key=${s[0]} className="card"><span className="m">${s[0]}</span><b>${s[1]}</b></div>`)}</div>
<div className="card sec" style=${{marginTop:16,padding:12}}><b>Orders by status</b><div className="bars">${ST.map(s=>{const n=ord.filter(o=>o.status===s).length;return h`<div key=${s} style=${{height:n/mx*100+"%"}} title=${s}>${n}</div>`})}</div><div className="m" style=${{display:"flex",gap:14,fontSize:11}}>${ST.map(s=>h`<span key=${s} style=${{flex:1,textAlign:"center"}}>${s}</span>`)}</div></div>
${adm&&S.users.filter(x=>x.role==="seller"&&!x.approved).map(x=>h`<div key=${x.email} className="card row"><span className="grow">Seller request: <b>${x.shop}</b> (${x.email})</span><button className="btn" onClick=${()=>S.setUsers(S.users.map(y=>y.email===x.email?{...y,approved:true}:y))}>Approve</button></div>`)}
<div className="two sec" style=${{gridTemplateColumns:"1fr 300px"}}><div><div className="card tw"><table className="tbl"><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody>${mine.map(p=>h`<tr key=${p.id}><td>${p.e} ${p.name}</td><td>${money(p.price)}</td><td><input type="number" min="0" value=${p.stock} style=${{width:70}} onChange=${e=>S.setProds(S.prods.map(x=>x.id===p.id?{...x,stock:+e.target.value}:x))}/></td><td><span className=${"pill "+(p.status==="approved"?"ok":"w")}>${p.status}</span></td><td>${adm&&p.status!=="approved"&&h`<button className="btn" onClick=${()=>S.setProds(S.prods.map(x=>x.id===p.id?{...x,status:"approved"}:x))}>Approve</button> `}<button className="btn r" onClick=${()=>confirm("Delete this product?")&&S.setProds(S.prods.filter(x=>x.id!==p.id))}>Delete</button></td></tr>`)}</tbody></table></div>
<h3>Orders</h3><div className="card tw"><table className="tbl"><tbody>${ord.map(o=>h`<tr key=${o.no}><td>${o.no}<div className="m">${o.name}</div></td><td>${money(part(o))}</td><td>${adm?h`<select value=${o.status} onChange=${e=>S.setOrders(S.orders.map(x=>x.no===o.no?{...x,status:e.target.value}:x))}>${ST.map(s=>h`<option key=${s}>${s}</option>`)}</select>`:o.status}</td></tr>`)}${!ord.length&&h`<tr><td className="m">No orders yet</td></tr>`}</tbody></table></div></div>
${adm||u.approved?h`<${PF}/>`:h`<div className="card pb">Your seller account is waiting for admin approval.</div>`}</div></div>`}

function Info(){return h`<div className="w sec"><h2>About & contact</h2><p>VoltEdge is a marketplace for new, refurbished and used electronics with warranty on every order.</p><p className="m">📍 Dar es Salaam · ✉️ support@voltedge.example · 📞 +255 700 000 000</p></div>`}

function Invoice(){const S=useContext(C),o=S.inv;if(!o)return null;return h`<div className="inv"><div className="card"><h3>Invoice ${o.no}</h3><p className="m">${o.date}<br/>${o.name} · ${o.addr}<br/>Payment: ${o.pay} · ${o.status}</p><table className="tbl"><tbody>${o.items.map(i=>h`<tr key=${i.id}><td>${i.q} × ${i.name}</td><td>${money(i.price*i.q)}</td></tr>`)}<tr><td>Delivery</td><td>${o.del?money(o.del):"Free"}</td></tr><tr><td><b>Total</b></td><td><b>${money(o.total)}</b></td></tr></tbody></table><p className="noprint"><button className="btn" onClick=${()=>window.print()}>Print</button> <button className="btn g" onClick=${()=>S.setInv(null)}>Close</button></p></div></div>`}

function Header(){const S=useContext(C),[q,setQ]=useState(""),[o,setO]=useState(false),r=S.r.split("-")[0];
const sg=q.length>1?S.live.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())).slice(0,5):[];
const L=[["home","Home"],["shop","Shop"],["categories","Categories"],["about","About"],["contact","Contact"]];
return h`<header><div className="nav w"><span className="logo" onClick=${()=>go("home")}>⚡ VoltEdge</span><div className="sb"><input placeholder="Search electronics…" value=${q} onChange=${e=>{setQ(e.target.value);setO(true)}} onKeyDown=${e=>{if(e.key==="Enter"){S.setF({q});setO(false);go("shop")}}} onBlur=${()=>setTimeout(()=>setO(false),150)}/>${o&&sg.length>0&&h`<div className="sug">${sg.map(p=>h`<div key=${p.id} onClick=${()=>{setQ("");go("product-"+p.id)}}>${p.e} ${p.name} <span className="m">${money(p.price)}</span></div>`)}</div>`}</div>
<button className="ic" aria-label="Wishlist" onClick=${()=>go("wishlist")}>♡${S.wish.length>0&&h`<i>${S.wish.length}</i>`}</button><button className="ic" aria-label="Cart" onClick=${()=>go("cart")}>🛒${S.count>0&&h`<i>${S.count}</i>`}</button><button className="ic" aria-label="Theme" onClick=${S.flip}>${S.dark?"☀️":"🌙"}</button>
${S.user?h`<button className="btn g" onClick=${()=>go(S.user.role==="buyer"?"account":"dashboard")}>${S.user.name.split(" ")[0]}</button>${S.user.role!=="buyer"&&h`<button className="btn g" onClick=${()=>go("account")}>Profile</button>`}`:h`<button className="btn g" onClick=${()=>go("login")}>Login</button><button className="btn" onClick=${()=>go("login")}>Register</button>`}
<nav className="links">${L.map(l=>h`<a key=${l[0]} className=${r===l[0]?"on":""} onClick=${()=>go(l[0])}>${l[1]}</a>`)}<a onClick=${()=>go("sell")}>Sell used</a></nav></div></header>`}

function App(){const[prods,setProds]=usePersist("ve_prods",SEED),[cart,setCart]=usePersist("ve_cart",[]),[wish,setWish]=usePersist("ve_wish",[]),[users,setUsers]=usePersist("ve_users",[]),[sess,setSess]=usePersist("ve_sess",null),[orders,setOrders]=usePersist("ve_orders",[]),[rev,setRev]=usePersist("ve_rev",{}),[theme,setTheme]=usePersist("ve_theme",null);
const[f0,setF0]=useState({}),[r,setR]=useState(location.hash.slice(1)||"home"),[tm,setTm]=useState(""),[inv,setInv]=useState(null);
const setF=x=>setF0(p=>({...p,...x}));const toast=m=>{setTm(m);setTimeout(()=>setTm(""),2200)};
useEffect(()=>{const f=()=>{setR(location.hash.slice(1)||"home");window.scrollTo(0,0)};addEventListener("hashchange",f);return()=>removeEventListener("hashchange",f)},[]);
useEffect(()=>{if(!users.some(u=>u.role==="admin"))hash("admin123").then(hs=>setUsers(us=>us.some(u=>u.role==="admin")?us:[...us,{name:"Admin",email:"admin@volt.test",hs,role:"admin",approved:true,phone:"",addr:""}]))},[]);
useEffect(()=>{const d=theme?theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.theme=d?"dark":"light"},[theme]);
const dark=document.documentElement.dataset.theme==="dark";
const user=users.find(u=>u.email===sess)||null,live=prods.filter(p=>p.status==="approved");
const lines=cart.map(c=>({p:prods.find(p=>p.id===c.id),q:c.q})).filter(l=>l.p);
const add=(id,q=1)=>{const p=prods.find(x=>x.id===id);setCart(c=>{const e=c.find(x=>x.id===id),n=Math.min(p.stock,(e?e.q:0)+q);return e?c.map(x=>x.id===id?{...x,q:n}:x):[...c,{id,q:n}]});toast("Added to cart")};
const setQty=(id,q)=>{const p=prods.find(x=>x.id===id);setCart(c=>q<1?c.filter(x=>x.id!==id):c.map(x=>x.id===id?{...x,q:Math.min(q,p.stock)}:x))};
const tw=id=>setWish(w=>w.includes(id)?w.filter(x=>x!==id):[...w,id]);
const totals=ex=>{const sub=lines.reduce((a,{p,q})=>a+p.price*q,0),save=lines.reduce((a,{p,q})=>a+(p.old-p.price)*q,0),del=ex<0||sub===0?0:(sub>1e6?0:15000)+(ex>0?ex:0);return{sub,save,del,total:sub+del}};
const placeOrder=o=>{setOrders([o,...orders]);setProds(prods.map(p=>{const i=o.items.find(x=>x.id===p.id);return i?{...p,stock:p.stock-i.q,sales:p.sales+i.q}:p}));setCart([])};
const S={prods,live,cart,lines,count:cart.reduce((a,c)=>a+c.q,0),wish,users,setUsers,user,setSess,orders,setOrders,rev,setRev,setProds,f:f0,setF,add,setQty,tw,totals,placeOrder,toast,r,inv,setInv,dark,flip:()=>setTheme(dark?"light":"dark")};
const[k,id]=r.split("-");const pages={home:Home,shop:Shop,cart:Cart,checkout:Checkout,wishlist:Wishlist,login:Auth,account:Account,dashboard:Dash,sell:Sell,about:Info,contact:Info,categories:()=>h`<div className="w sec"><h2>Categories</h2><${CatGrid}/></div>`};
const Pg=pages[k]||Home;
return h`<${C.Provider} value=${S}><${Header}/><main>${k==="product"?h`<${Detail} id=${+id}/>`:h`<${Pg}/>`}</main><${Invoice}/><footer><div className="w"><b style=${{color:"#fff"}}>⚡ VoltEdge</b><p>Genuine electronics, fair prices, real warranty.</p><p><a onClick=${()=>go("shop")}>Shop</a> · <a onClick=${()=>go("categories")}>Categories</a> · <a onClick=${()=>go("sell")}>Sell used</a> · <a onClick=${()=>go("contact")}>Contact</a></p><p>© 2026 VoltEdge Electronics</p></div></footer>${tm&&h`<div className="toast">${tm}</div>`}<//>`}
ReactDOM.createRoot(document.getElementById("root")).render(h`<${App}/>`);
</script></body></html>
